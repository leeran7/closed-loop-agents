name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sync generated outputs
        run: node scripts/sync.mjs
      - name: Generated outputs are current
        run: |
          git diff --exit-code -- .claude .cursor .codex .agents || \
            (echo "::error::Generated outputs are stale - run 'node scripts/sync.mjs' and commit." && exit 1)
      - name: Hygiene checks
        run: node scripts/hygiene.mjs
      - name: Install orchestrator deps
        run: yarn --cwd orchestrator install --frozen-lockfile
      - name: Orchestrator tests
        run: yarn --cwd orchestrator test
